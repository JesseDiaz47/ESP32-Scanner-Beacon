[env:esp32dev]
; Pinned: the installed framework package is Arduino core 2.0.17, whose BLE API
; takes std::string (not String) and whose IPAddress has no IPv6 ctors.
; Unpinned "espressif32" resolves to platform 7.0.1 against that same stale
; core-2.0.17 package, which is a mismatch waiting to break. 6.8.1 is the
; platform that actually ships core 2.0.17 — and what esp32-pca9685-demo uses.
platform = espressif32@6.8.1
board = esp32dev
framework = arduino
lib_deps =
monitor_speed = 115200
upload_speed = 921600
; OTA needs TWO app partitions to swap between, and huge_app.csv has only one.
; min_spiffs gives 2x 1.875MB slots; the image is ~1.5MB, so it fits with room.
board_build.partitions = min_spiffs.csv

; Reflash over WiFi: `pio run -e ota -t upload`
; Requires OTA_PASSWORD exported in your shell (it is in include/secrets.h,
; which is gitignored) so the password never lands in version control.
; Default target is the board's own AP — join "jesse-scanner" first.
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags = --auth=${sysenv.OTA_PASSWORD}
