[env:esp32dev]
; Pinned: the installed framework package is Arduino core 2.0.17, whose BLE API
; takes std::string (not String) and whose IPAddress has no IPv6 ctors.
; Unpinned "espressif32" resolves to platform 7.0.1 against that same stale
; core-2.0.17 package, which is a mismatch waiting to break. 6.8.1 is the
; platform that actually ships core 2.0.17 — and what esp32-pca9685-demo uses.
platform = espressif32@6.8.1
board = esp32dev
framework = arduino
lib_deps =
monitor_speed = 115200
upload_speed = 921600
; WiFi + WebServer + BLE together overflow the default 1.31MB app partition.
board_build.partitions = huge_app.csv
